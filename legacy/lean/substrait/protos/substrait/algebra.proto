// SPDX-License-Identifier: Apache-2.0
//
// REDUCED SUBSET of substrait/algebra.proto (upstream commit
// 6706015ffdb19345fef399ef8238e3e6269cb380).  Kept: exactly the message
// surface the Substrait semantic model (`Substrait.Proto`) can emit,
// so the protoc-gen-lean4 wire codec stays small enough to elaborate.
//
// Every retained message/field is a VERBATIM copy of the upstream definition
// (same package, field numbers, wire types, enum values).  Dropped messages
// (WindowFunction, Subquery, SwitchExpression, SingularOrList, MultiOrList,
// Lambda, MaskExpression, ExchangeRel, ExpandRel, TopNRel, HashJoinRel,
// MergeJoinRel, NestedLoopJoinRel, ConsistentPartitionWindowRel, DdlRel,
// UpdateRel, ReferenceRel, LocalFiles, IcebergTable, ExtensionTable, Dynamic
// Parameter, ...) are outside the semantic model's surface today.  If the
// model grows them, re-merge them from the upstream commit.
//
// WIRE COMPAT: a plan produced from this subset encodes byte-identically to
// one produced from the full upstream schema, provided it uses only the
// retained messages (field numbers / types are unchanged).

syntax = "proto3";

package substrait;

import "google/protobuf/any.proto";
import "substrait/extensions/extensions.proto";
import "substrait/type.proto";

option csharp_namespace = "Substrait.Protobuf";
option go_package = "github.com/substrait-io/substrait-protobuf/go/substraitpb";
option java_multiple_files = true;
option java_package = "io.substrait.proto";

message RelCommon {
  oneof emit_kind {
    Direct direct = 1;
    Emit emit = 2;
  }

  // Optional plan-wide unique identifier for this relation. Required when
  // this relation is the binding point for an OuterReference using
  // rel_reference. Must be unique across all rels within a Plan.
  // Must be >= 1 when set.
  optional uint32 rel_anchor = 5;

  // Direct indicates no change on presence and ordering of fields in the output.
  message Direct {}

  // Remap which fields are output and in which order
  message Emit {
    repeated int32 output_mapping = 1;
  }
}

// The scan operator of base data (physical or virtual), including filtering and projection.
message ReadRel {
  RelCommon common = 1;
  NamedStruct base_schema = 2;
  Expression filter = 3;
  Expression best_effort_filter = 11;

  // Definition of which type of scan operation is to be performed
  oneof read_type {
    VirtualTable virtual_table = 5;
    NamedTable named_table = 7;
  }

  // A base table. The list of string is used to represent namespacing (e.g., mydb.mytable).
  // This assumes shared catalog between systems exchanging a message.
  message NamedTable {
    repeated string names = 1;
  }

  // A table composed of expressions.
  message VirtualTable {
    reserved 1;
    reserved "values";

    repeated Expression.Nested.Struct expressions = 2;
  }
}

message ProjectRel {
  RelCommon common = 1;
  Rel input = 2;
  repeated Expression expressions = 3;
}

// The binary JOIN relational operator left-join-right, including various join
// types, a join condition, and an optional filter on the joined output.
message JoinRel {
  RelCommon common = 1;
  Rel left = 2;
  Rel right = 3;
  // A boolean condition evaluated over the left and right inputs that
  // determines whether a pair of records is a match.
  Expression expression = 4;
  // An optional boolean filter applied to each output record after
  // join-type-specific output formation is complete.
  // Semantically equivalent to placing a FilterRel directly above this join.
  Expression post_join_filter = 5;

  JoinType type = 6;

  enum JoinType {
    JOIN_TYPE_UNSPECIFIED = 0;
    JOIN_TYPE_INNER = 1;
    JOIN_TYPE_OUTER = 2;
    JOIN_TYPE_LEFT = 3;
    JOIN_TYPE_RIGHT = 4;
    JOIN_TYPE_LEFT_SEMI = 5;
    JOIN_TYPE_LEFT_ANTI = 6;
    JOIN_TYPE_LEFT_SINGLE = 7;
    JOIN_TYPE_RIGHT_SEMI = 8;
    JOIN_TYPE_RIGHT_ANTI = 9;
    JOIN_TYPE_RIGHT_SINGLE = 10;
    JOIN_TYPE_LEFT_MARK = 11;
    JOIN_TYPE_RIGHT_MARK = 12;
  }
}

// The binary cross-join relational operator left-join-right
message CrossRel {
  RelCommon common = 1;
  Rel left = 2;
  Rel right = 3;
}

message FetchRel {
  RelCommon common = 1;
  Rel input = 2;
  // Expression evaluated into a non-negative integer specifying the number
  // of records to skip. An expression evaluating to null is treated as 0.
  // Recommended type for offset is int64. Unset is treated as 0.
  Expression offset_expr = 5;
  // Expression evaluated into a non-negative integer specifying the number
  // of records to return. An expression evaluating to null signals that ALL
  // records should be returned.
  // Recommended type for count is int64. Unset signals that ALL records
  // should be returned.
  Expression count_expr = 6;
}

// The relational operator representing a GROUP BY Aggregate
message AggregateRel {
  RelCommon common = 1;

  // Input of the aggregation
  Rel input = 2;

  // A list of zero or more grouping sets that the aggregation measures should
  // be calculated for.
  repeated Grouping groupings = 3;

  // A list of one or more aggregate expressions along with an optional filter.
  repeated Measure measures = 4;

  // A list of zero or more grouping expressions that grouping sets (i.e.,
  // `Grouping` messages in the `groupings` field) can reference.
  repeated Expression grouping_expressions = 5;

  message Grouping {
    reserved 1;

    // A list of zero or more references to grouping expressions, i.e., indices
    // into the `grouping_expression` list.
    repeated uint32 expression_references = 2;
  }

  message Measure {
    AggregateFunction measure = 1;
    // An optional boolean expression that acts to filter which records are
    // included in the measure.
    Expression filter = 2;
  }
}

message SortRel {
  RelCommon common = 1;
  Rel input = 2;
  repeated SortField sorts = 3;
}

// The relational operator capturing simple FILTERs (as in the WHERE clause of SQL)
message FilterRel {
  RelCommon common = 1;
  Rel input = 2;
  Expression condition = 3;
}

// The relational set operators (intersection/union/etc..)
message SetRel {
  RelCommon common = 1;
  // The first input is the primary input, the remaining are secondary
  // inputs.  There must be at least two inputs.
  repeated Rel inputs = 2;
  SetOp op = 3;

  enum SetOp {
    SET_OP_UNSPECIFIED = 0;
    SET_OP_MINUS_PRIMARY = 1;
    SET_OP_MINUS_PRIMARY_ALL = 7;
    SET_OP_MINUS_MULTISET = 2;
    SET_OP_INTERSECTION_PRIMARY = 3;
    SET_OP_INTERSECTION_MULTISET = 4;
    SET_OP_INTERSECTION_MULTISET_ALL = 8;
    SET_OP_UNION_DISTINCT = 5;
    SET_OP_UNION_ALL = 6;
  }
}

// A custom relational operator with a single input.
message ExtensionSingleRel {
  RelCommon common = 1;
  Rel input = 2;
  google.protobuf.Any detail = 3;
}

// A custom relational operator with zero inputs.
message ExtensionLeafRel {
  RelCommon common = 1;
  google.protobuf.Any detail = 2;
}

// A custom relational operator with multiple inputs.
message ExtensionMultiRel {
  RelCommon common = 1;
  repeated Rel inputs = 2;
  google.protobuf.Any detail = 3;
}

// A relation (used internally in a plan)
message Rel {
  oneof rel_type {
    ReadRel read = 1;
    FilterRel filter = 2;
    FetchRel fetch = 3;
    AggregateRel aggregate = 4;
    SortRel sort = 5;
    JoinRel join = 6;
    ProjectRel project = 7;
    SetRel set = 8;
    ExtensionSingleRel extension_single = 9;
    ExtensionMultiRel extension_multi = 10;
    ExtensionLeafRel extension_leaf = 11;
    CrossRel cross = 12;
    WriteRel write = 19;
  }
}

message RelRoot {
  // A relation
  Rel input = 1;
  // Field names in depth-first order.
  repeated string names = 2;
}

// The relational operator that adds/removes/modifies records in a table
message WriteRel {
  // Definition of which TABLE we are operating on
  oneof write_type {
    NamedObjectWrite named_table = 1;
  }

  // The schema of the table (must align with Rel input)
  NamedStruct table_schema = 3;

  // The type of operation to perform
  WriteOp op = 4;

  // The relation that determines the records to add/remove/modify
  Rel input = 5;

  RelCommon common = 7;

  enum WriteOp {
    WRITE_OP_UNSPECIFIED = 0;
    // The insert of new records in a table
    WRITE_OP_INSERT = 1;
    // The removal of records from a table
    WRITE_OP_DELETE = 2;
    // The modification of existing records within a table
    WRITE_OP_UPDATE = 3;
    // The Creation of a new table, and the insert of new records in the table
    WRITE_OP_CTAS = 4;
  }
}

message NamedObjectWrite {
  // The list of string is used to represent namespacing (e.g., mydb.mytable).
  repeated string names = 1;
}

// A scalar function call.
message ScalarFunction {
  reserved 2;
  reserved "args";

  // Points to a function_anchor defined in this plan. Required.
  uint32 function_reference = 1;

  // The arguments to be bound to the function.
  repeated FunctionArgument arguments = 4;

  // Must be set to the return type of the function.
  Type output_type = 3;
}

// An aggregate function.
message AggregateFunction {
  reserved 2;
  reserved "args";

  // Points to a function_anchor defined in this plan. Required.
  uint32 function_reference = 1;

  // The arguments to be bound to the function.
  repeated FunctionArgument arguments = 7;

  // Must be set to the return type of the function.
  Type output_type = 5;
}

message FunctionArgument {
  oneof arg_type {
    string enum = 1;
    Type type = 2;
    Expression value = 3;
  }
}

message SortField {
  Expression expr = 1;

  oneof sort_kind {
    SortDirection direction = 2;
    // References a function_anchor defined in this plan.
    uint32 comparison_function_reference = 3;
  }
  enum SortDirection {
    SORT_DIRECTION_UNSPECIFIED = 0;
    SORT_DIRECTION_ASC_NULLS_FIRST = 1;
    SORT_DIRECTION_ASC_NULLS_LAST = 2;
    SORT_DIRECTION_DESC_NULLS_FIRST = 3;
    SORT_DIRECTION_DESC_NULLS_LAST = 4;
    SORT_DIRECTION_CLUSTERED = 5;
  }
}

message Expression {
  reserved 10;
  reserved "enum";

  oneof rex_type {
    Literal literal = 1;
    FieldReference selection = 2;
    ScalarFunction scalar_function = 3;
    IfThen if_then = 6;
    Cast cast = 11;
  }

  message Literal {
    reserved 14, 17, 27;

    oneof literal_type {
      bool boolean = 1;
      int32 i8 = 2;
      int32 i16 = 3;
      int32 i32 = 5;
      int64 i64 = 7;
      float fp32 = 10;
      double fp64 = 11;
      string string = 12;
      bytes binary = 13;
      Decimal decimal = 24;
      Struct struct = 25;
      Map map = 26;
      Type null = 29; // a typed null literal
      List list = 30;
      Type.List empty_list = 31;
      Type.Map empty_map = 32;
    }

    // Whether the literal_type above should be treated as a nullable type.
    bool nullable = 50;

    // optionally points to a type_variation_anchor defined in this plan.
    uint32 type_variation_reference = 51;

    message Decimal {
      // little-endian twos-complement integer representation of complete value
      // (ignoring precision) Always 16 bytes in length
      bytes value = 1;
      // The maximum number of digits allowed in the value.
      int32 precision = 2;
      // declared scale of decimal literal
      int32 scale = 3;
    }

    message Map {
      message KeyValue {
        Literal key = 1;
        Literal value = 2;
      }

      repeated KeyValue key_values = 1;
    }

    message Struct {
      // A possibly heterogeneously typed list of literals
      repeated Literal fields = 1;
    }

    message List {
      // A homogeneously typed list of literals
      repeated Literal values = 1;
    }
  }

  // A reference to data within a structured object, supporting navigation into
  // nested fields.
  message FieldReference {
    // Whether this is composed of a single element reference or a masked
    // element subtree
    oneof reference_type {
      ReferenceSegment direct_reference = 1;
    }

    // The origin of the data being referenced.
    oneof root_type {
      RootReference root_reference = 4;
    }

    // Singleton that expresses this FieldReference is rooted off the root
    // incoming record type
    message RootReference {}
  }

  message ReferenceSegment {
    oneof reference_type {
      MapKey map_key = 1;
      StructField struct_field = 2;
      ListElement list_element = 3;
    }

    message MapKey {
      // literal based reference to specific possible value in map.
      Literal map_key = 1;

      // Optional child segment
      ReferenceSegment child = 2;
    }

    message StructField {
      // zero-indexed ordinal position of field in struct
      int32 field = 1;

      // Optional child segment
      ReferenceSegment child = 2;
    }

    message ListElement {
      // zero-indexed ordinal position of element in list
      int32 offset = 1;

      // Optional child segment
      ReferenceSegment child = 2;
    }
  }

  message IfThen {
    // A list of one or more IfClauses
    repeated IfClause ifs = 1;
    // The returned Expression if no IfClauses are satisified
    Expression else = 2;

    message IfClause {
      Expression if = 1;
      Expression then = 2;
    }
  }

  message Cast {
    Type type = 1;
    Expression input = 2;
    FailureBehavior failure_behavior = 3;

    enum FailureBehavior {
      FAILURE_BEHAVIOR_UNSPECIFIED = 0;
      FAILURE_BEHAVIOR_RETURN_NULL = 1;
      FAILURE_BEHAVIOR_THROW_EXCEPTION = 2;
    }
  }

  // Expression to dynamically construct nested types.
  message Nested {
    // Whether the returned nested type is nullable.
    bool nullable = 1;

    // Optionally points to a type_variation_anchor defined in this plan.
    uint32 type_variation_reference = 2;

    oneof nested_type {
      Struct struct = 3;
      List list = 4;
      Map map = 5;
    }

    message Map {
      message KeyValue {
        // Mandatory key/value expressions.
        Expression key = 1;
        Expression value = 2;
      }

      repeated KeyValue key_values = 1;
    }

    message Struct {
      // Zero or more possibly heterogeneously-typed list of expressions that
      // form the struct fields.
      repeated Expression fields = 1;
    }

    message List {
      // A homogeneously-typed list of one or more expressions that form the
      // list entries.
      repeated Expression values = 1;
    }
  }
}
