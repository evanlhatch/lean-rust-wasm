# SecretSpec — declarative secrets, provisioned per environment.
# Load at runtime: `secretspec run -- <cmd>` (never exported to the shell).
# Provider chain: dotenv (local dev) <-> infisical (team). See
# https://secretspec.dev for the full reference.

[project]
name = "lean-rust-wasm"
revision = "1.0"

[providers]
# Local dev: repo-root .env (gitignored). Zero setup.
default = "dotenv://.env"
# Team: Infisical. Swap in your project UUID + env slug, then flip
# devenv.yaml's secretspec provider if desired. Auth:
# INFISICAL_CLIENT_ID/INFISICAL_CLIENT_SECRET (machine identity) or
# INFISICAL_TOKEN. Consumers (deploy recipes) never change.
# infisical = "infisical://app.infisical.com/PROJECT_UUID?env=dev"

[profiles.default]
# Cloudflare Pages deploy (cloudflare.nix + `just deploy`). Optional
# until the first real deploy: `wrangler login` (browser OAuth) also
# works locally without these.
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token (Pages:Edit)", required = false }
CLOUDFLARE_ACCOUNT_ID = { description = "Cloudflare account id", required = false }

# [profiles.production]
# CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token (Pages:Edit)", providers = ["infisical"] }
