# ── ci.yml: two-lane CI ──────────────────────────────────────────────
# Coverage map (what CI guards vs what stays local-only):
#
#   Job 1 (lean, every push/PR) — the Lean-only floor:
#     lean-pkg-inventory, lean-proof-roots, lean-build, lean-test
#     (= lean-build: it is a dependency-only alias), gen-check (the
#     byte-tie — pure gates exe, no cargo), manifest-check, lean-axioms,
#     check-schema, breaking, lean-lint. All are `lake build`/`lake exe`/
#     `lake env` recipes — no cc-rs, no ring, no CC export needed.
#
#   Job 2 (rust/wasm, WEEKLY SCHEDULE + workflow_dispatch ONLY) — the
#     devenv-profile gates + the Rust test suite: wasm-compile, wit-check,
#     splice-smoke, rt-conformance, test (nextest + doctests). Runs on
#     schedule/dispatch, not per-push: the devenv --profile wasm nix env
#     plus the full gate battery is a ~1-2h runner bill that does not
#     belong on every PR. Coverage gap on plain pushes (guarded locally
#     by `just gates`): clippy/fmt/typos/secrets/deny (the `just check`
#     Rust lane), wasm-guest-*/check-wasm cross-compiles, demo, docs,
#     edgepython, budget-check, native-policy, kernel-check, coverage,
#     wasm-diff-check. Those stay LOCAL — wire `just check` in when the
#     Rust lane proves stable on the runner.
#
# Toolchain assumptions (verified against the justfile):
#   - lean_tc hardcodes ~/.elan/toolchains/leanprover--lean4---v4.33.0/bin
#     — a manual elan-init install lands exactly there; elan shims are
#     bypassed by the justfile, so no PATH shim step is needed.
#   - Machines + dbsp pin mathlib v4.33.0 (git). A fresh runner would
#     build mathlib FROM SOURCE (~2h) — `lake exe cache get!` pulls
#     mathlib's public cachix oleans first (the standard downstream
#     pattern); on failure the build proceeds the slow way.
#   - The justfile hardcodes $HOME/lean-rust-wasm paths (lean_tc,
#     rt-conformance's CC, demo recipe), so job 2 symlinks
#     $GITHUB_WORKSPACE → $HOME/lean-rust-wasm before running anything.
#   - guestlang-tools: the justfile prefers ~/.local/guestlang-tools/bin
#     over PATH for wasm-tools/wac. Reason (notes/full-remaining-work.md):
#     wit-bindgen 0.61's wit-component 0.258 async-lift encoding predates
#     nixpkgs' 1.256 CLI — job 2 cargo-installs wasm-tools 1.258.0 +
#     wac-cli 0.11.0 into that exact root. nixpkgs' wasm-tools/wac stay
#     as fallback via the justfile's [ -x ] checks.
#
# Caching: elan toolchains + lean .lake per job, cargo registry + target,
# the cachix devenv cache, and the cargo-installed guestlang-tools root.
# devenv.yaml has no private cachix — the cachix-action below is the
# public devenv cache (pull-only without the optional repo secret).
#
# Maintainer setup:
#   - CACHIX_AUTH_TOKEN repo secret (OPTIONAL) — pushes nix/devenv builds
#     to cachix.org/devenv. Unset = pull-only (still works, slower).
#   - Nothing else: Lean is elan-pinned (v4.33.0 = lean-toolchain),
#     nix/devenv are the cachix-installed pins, guest tools are pinned
#     below. deploy.yml handles secrets via secretspec; CI runs no
#     secretspec commands.
# ──────────────────────────────────────────────────────────────────────

name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Weekly, Mondays 06:00 UTC — runs BOTH lanes (the rust/wasm lane
        # is if-gated to schedule + workflow_dispatch).
        - cron: "0 6 * * 1"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lean:
        name: lean floor (build + tests + byte-tie + manifest + axioms + schema + lint)
        runs-on: ubuntu-latest
        timeout-minutes: 240
        steps:
            - uses: actions/checkout@v4

            - name: install just
              uses: taiki-e/install-action@v2
              with:
                  tool: just

            - name: cache elan (v4.33.0 — the lean-toolchain pin)
              uses: actions/cache@v4
              with:
                  path: ~/.elan
                  key: lean-elan-v1-${{ runner.os }}-leanprover-lean4-v4.33.0

            - name: install elan + pinned toolchain (leanprover/lean4:v4.33.0)
              run: |
                  set -euo pipefail
                  [ -x "$HOME/.elan/bin/elan" ] || \
                    curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y \
                      --default-toolchain leanprover/lean4:v4.33.0
                  "$HOME/.elan/bin/elan" show
                  test -d "$HOME/.elan/toolchains/leanprover--lean4---v4.33.0/bin"

            - name: cache lake builds (lean/*/.lake)
              uses: actions/cache@v4
              with:
                  path: lean/*/.lake
                  key: lean-lake-v1-${{ runner.os }}-v4.33.0-${{ hashFiles('lean/*/lakefile.toml', 'lean/*/lake-manifest.json') }}
                  restore-keys: |
                      lean-lake-v1-${{ runner.os }}-v4.33.0-

            # Machines + dbsp require mathlib v4.33.0 (git, lakefile.toml).
            # Without this, lake builds mathlib from source on the runner
            # (~2h on 4 cores). The cache exe ships with mathlib; `!`
            # forces the fetch. Non-fatal: a cache miss just builds slow.
            - name: fetch mathlib olean cache (Machines + dbsp pin mathlib v4.33.0)
              run: |
                  set -euo pipefail
                  TC="$HOME/.elan/toolchains/leanprover--lean4---v4.33.0/bin"
                  for p in Machines dbsp; do
                    (cd "lean/$p" && PATH="$TC:$PATH" "$TC/lake" exe cache get!) \
                      || echo "WARN: mathlib cache unavailable for $p — building from source"
                  done

            # Lean-only gates — no CC needed: lake builds/env only, no cc-rs.
            # gen-check + manifest-check run here (not in job 2): they are
            # pure `lake exe gates` invocations — no cargo, no devenv.
            - name: lean gates
              run: |
                  just lean-pkg-inventory lean-proof-roots \
                    lean-build lean-test \
                    gen-check manifest-check \
                    lean-axioms check-schema breaking lean-lint

            # Consumed by job 2 so wasm-compile's lake build does not
            # rebuild upstream oleans. Only when job 2 will run.
            - name: upload lean .lake artifacts (oleans for job 2)
              if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: lean-lake
                  path: lean/*/.lake
                  retention-days: 1

    rust-wasm:
        name: rust/wasm lane (gates + tests — weekly/on-demand)
        needs: lean
        runs-on: ubuntu-latest
        timeout-minutes: 360
        # NOT on push/PR: the devenv --profile wasm nix env + the full
        # battery is a 1-2h bill. Weekly + on-demand.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        steps:
            - uses: actions/checkout@v4

            # The justfile hardcodes $HOME/lean-rust-wasm (lean_tc,
            # rt-conformance's CC). Symlink the checkout into place.
            - name: symlink workspace → $HOME/lean-rust-wasm
              run: |
                  set -euo pipefail
                  [ "$HOME/lean-rust-wasm" = "$GITHUB_WORKSPACE" ] && exit 0
                  ln -s "$GITHUB_WORKSPACE" "$HOME/lean-rust-wasm"

            - name: install nix
              uses: cachix/install-nix-action@v31

            - name: devenv cachix cache
              uses: cachix/cachix-action@v16
              with:
                  name: devenv
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

            - name: install devenv
              run: nix profile add nixpkgs#devenv

            - name: cache elan (v4.33.0 — wasm-compile builds the Lean wasm-backend)
              uses: actions/cache@v4
              with:
                  path: ~/.elan
                  key: lean-elan-v1-${{ runner.os }}-leanprover-lean4-v4.33.0

            - name: install elan + pinned toolchain (leanprover/lean4:v4.33.0)
              run: |
                  set -euo pipefail
                  [ -x "$HOME/.elan/bin/elan" ] || \
                    curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y \
                      --default-toolchain leanprover/lean4:v4.33.0
                  test -d "$HOME/.elan/toolchains/leanprover--lean4---v4.33.0/bin"

            - name: cache cargo (registry + target)
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: rust-wasm-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: |
                      rust-wasm-v1-${{ runner.os }}-

            - name: cache cargo-installed guestlang-tools
              uses: actions/cache@v4
              with:
                  path: ~/.local/guestlang-tools
                  key: guestlang-tools-v1-${{ runner.os }}-wasm-tools-1.258.0-wac-0.11.0

            # The justfile prefers ~/.local/guestlang-tools/bin over PATH;
            # nixpkgs' wasm-tools 1.256 is too old for wit-bindgen 0.61's
            # (wit-component 0.258) async-lift encodings. Pin the cargo
            # builds to the exact root the justfile checks.
            - name: cargo-install wasm-tools 1.258.0 + wac-cli 0.11.0 → ~/.local/guestlang-tools
              run: |
                  devenv shell --profile wasm -- bash -c '
                    set -euo pipefail
                    command -v "$HOME/.local/guestlang-tools/bin/wasm-tools" >/dev/null 2>&1 || \
                      cargo install --locked --root "$HOME/.local/guestlang-tools" wasm-tools --version 1.258.0
                    [ -x "$HOME/.local/guestlang-tools/bin/wac" ] || \
                      cargo install --locked --root "$HOME/.local/guestlang-tools" wac-cli --version 0.11.0
                  '

            # None of the gate commands below cross-compile; best-effort
            # parity with the local wasm profile (devenv may ship no
            # rustup — overlay toolchain — in which case this is a no-op).
            - name: add wasm32-unknown-unknown target (if rustup)
              run: |
                  devenv shell --profile wasm -- bash -c \
                    'command -v rustup >/dev/null && rustup target add wasm32-unknown-unknown || echo "no rustup (overlay toolchain) — not needed by these gates"'

            - name: download lean .lake artifacts
              uses: actions/download-artifact@v4
              with:
                  name: lean-lake
                  path: .

            # The CC export is REQUIRED (notes/lean-refactor-guide.md):
            # cc-rs on ring needs the wasm profile's clang headers; the
            # profile is provisioned by the devenv shell invocation itself.
            - name: rust/wasm gates + tests
              run: |
                  devenv shell --profile wasm -- bash -c '
                    set -euo pipefail
                    export CC="$HOME/lean-rust-wasm/.devenv/profiles/wasm/profile/bin/cc"
                    just wasm-compile wit-check splice-smoke rt-conformance test
                  '
