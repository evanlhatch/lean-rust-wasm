[package]
name = "wire"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
arbitrary = ["dep:arbitrary"]

[dependencies]
# The first transport adapter: noq (n0-computer's Quinn fork).
# Default features bring: rustls + ring crypto + tokio runtime.
noq = "1.3"
# Optional: arbitrary::Arbitrary for Val (fuzz targets, property tests).
# The `arbitrary` Cargo feature gate keeps the derive dep out of the
# public crate graph (no transitive arbitrary in production builds).
arbitrary = { version = "1", features = ["derive"], optional = true }
# noq does NOT re-export its `proto` crate — the QUIC-TLS config types
# (QuicClientConfig / QuicServerConfig) live here. Version must match noq.
noq-proto = "1.3"
# rustls config builder for the QUIC TLS handshake; pki-types comes via
# rustls::pki_types. Version pinned to what noq itself builds against.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
# Self-signed certs for the dev/test loop ONLY (see lib.rs — LOUD caveat).
rcgen = "0.14"
# Frame encoding for the RPC layer (rpc.rs): serde_json::Value
# navigation only — no serde derive (workspace pattern, see
# steel-host's test note).
serde_json = "1"
# Stream trait + StreamExt for the streaming-call verb (rpc.rs
# RpcTarget::stream, item forwarding). Light shape: no default
# features (futures-util is already in the graph via noq/tokio).
futures-util = { version = "0.3", default-features = false, features = ["async-await"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
# Fuzz targets (tests/val_from_json, tests/stream_frames): bolero's
# `arbitrary` feature powers with_arbitrary::<T>() structured inputs.
bolero = { version = "0.13", features = ["arbitrary"] }
arbitrary = { version = "1", features = ["derive"] }

# Enable the crate's `arbitrary` feature for fuzz/test targets.
wire = { path = ".", features = ["arbitrary"] }

[[test]]
name = "val_from_json"
harness = false

[[test]]
name = "stream_frames"
harness = false