[package]
name = "lean-sys-v433"
version = "0.33.0"
authors = [
    "Jad Ghalayini <jeg74@cl.cam.ac.uk>",
    "Mario Carneiro <mcarneir@andrew.cmu.edu>",
    "Zhu Yifan <i@zhuyi.fan>",
]
edition = "2021"
description = "Bindings to Lean 4's C API, vendored from digama0/lean-sys and bumped to leanprover/lean4 v4.33.0"
license = "MIT OR Apache-2.0"
keywords = ["lean", "math", "bindings"]
categories = ["external-ffi-bindings"]
# Static archives only; the smoke test links against the elan toolchain's
# lib/lean + lib. See lean-compat.md for the ABI surface + bump rule.
links = "lean_sys_v433"

[features]
default = []

[dependencies]
libc = { version = "0.2", default-features = false }
memoffset = "0.9"
static_assertions = "1.1.0"
parking_lot = "0.12"

[dev-dependencies]
rand = "0.9"
rand_xoshiro = "0.7"

[build-dependencies]
cc = "1.0"

# Raw FFI crate: unsafe extern declarations are the entire point. Do NOT
# inherit the workspace lint set (unsafe_code = "deny").
