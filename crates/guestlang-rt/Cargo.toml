[package]
name = "guestlang-rt"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata.notes]
scope = "standalone embeddable runtime — the wasmi half of the dual-engine story"

# wasmi: pure-Rust interpreter — deterministic, fuel-metered, ~1MB.
# CORE wasm only (the component wrapper is the wasmtime host's job).
[dependencies]
wasmi = "2.0"
# The HARD pool's IPC: the worker binary's job/answer codec on
# stdin/stdout (the subprocess boundary carries JSON, not Arcs). The
# SAME pinned version the dev-deps already audited — no new upstream.
serde_json = "1"

[dev-dependencies]
# The conformance test compares against the wasmtime run of the SAME module.
wasmtime = { version = "47", default-features = false, features = ["cranelift"] }
# Fuzz targets (tests/module_bytes, tests/snapshot_restore_seq):
# bolero's `arbitrary` feature powers with_arbitrary::<T>() inputs.
bolero = { version = "0.13", features = ["arbitrary"] }
arbitrary = { version = "1", features = ["derive"] }

[[test]]
name = "module_bytes"
harness = false

[[test]]
name = "snapshot_restore_seq"
harness = false
