[package]
name = "forge"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# Pipeline orchestrator: lake emitters -> byte-tie -> component link.
# Deps land with each phase (serde, sha2, wasm-encoder...).
serde_json = "1"
# Errors: fast-observe IS the error tool (root Cargo.toml policy). The
# DRIVER's faults flow as Fault<ForgeFault>; the io error channels in
# oci.rs stay (tests consume them) and map into the fault tree at the
# driver seam. default-features = false:
# libraries must not forward fastrace (guestlang-host's manifest note).
fast-observe = { version = "0.1", default-features = false, features = ["instant"] }
sha2 = "0.10"
workspace-alloc = { path = "../workspace-alloc" }
