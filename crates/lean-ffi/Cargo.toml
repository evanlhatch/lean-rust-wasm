[package]
name = "lean-ffi"
version = "0.1.0"
authors = ["evan"]
edition = "2021"
description = "Safe Lean 4.33 FFI layer over lean-sys-v433: RAII object ownership, process-global runtime init, byte/string marshaling"
license = "MIT OR Apache-2.0"

[dependencies]
lean-sys-v433 = { path = "../lean-sys-v433" }
thiserror = "2"

[build-dependencies]
cc = "1.0"

# FFI crate: unsafe blocks around lean-sys-v433 calls are the entire point.
# Do NOT inherit the workspace lint set (unsafe_code = "deny"), mirroring
# lean-sys-v433's Cargo.toml note.
