[package]
name = "mandate-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# The persistence lane: the append-only delta log — the byte-exact port
# of SchemaCore's journal codec (the journal written on the component's
# effects; the full lifecycle integration is a later order).
mandate-delta = { path = "../mandate-delta" }
# THE WASMI LEG (D1): the wasmi standalone runtime — the shared
# deterministic profile's reader + the three-way duel's third engine.
# The profile is parsed ONCE here (this crate's wasmtime applier and
# mandate-rt's wasmi applier consume the SAME parsed value — never two
# hand-synced configs).
mandate-rt = { path = "../mandate-rt" }
# The ATOM codec's single home (the generated crate, byte-tied to
# SchemaCore.Codec by the gates + the duel vectors): the commit duel
# decodes the Lean-emitted proposal vectors through IT, never a
# hand-mirrored varint (the drift class the wave-23 dedup closed).
# mandate-delta already consumes it; the host rides the same rule.
schema-generated = { path = "../schema-generated" }
# The engine — version twin of legacy/crates/guestlang-host (wasmtime 47).
# Features mirror legacy's minus everything the first seed doesn't use:
# core modules + the component-model path (the component lane's host
# face: the component loads, the export calls with typed values).
wasmtime = { version = "47", default-features = false, features = [
  "cranelift",
  "runtime",
  "std",
  "component-model",
] }
# The typed-error derive (12 §8's no-bare-panics discipline). The
# fast-observe fault registry integration (the causal trees) is a LATER
# order — this enum is the honest first-seed surface, structured so each
# variant maps onto one `@[host_fault]` row.
thiserror = "2"
# THE GENERATED FAULTS (the faults lane's consumption — 12 §8: the error
# surface is DECLARED in the Lean registry, never hand-written here): the
# generated typed-error enum in fast-observe's `error!` face (the
# allocated E-codes + the registry ENTRIES + the policy axis), byte-tied
# to `Faults.Spec` by `gates gen-check`. The host's model-level refusals
# report their fault through [`HostError::fault`].
mandate-faults = { path = "../mandate-faults" }
# THE OBSERVABILITY ENGINE (wave-30 C1 — the lifecycle/ledger scopes +
# the fault registry's engine): `default-features = false` — THIS IS A
# LIBRARY; the BINARY (the composition root) enables fastrace
# (fast-observe's library-level-tracing rule). NIGHTLY: fast-observe is
# nightly-only — crates/rust-toolchain.toml pins the lane.
fast-observe = { path = "../../../fast-observe", default-features = false }

[dev-dependencies]
# The tamper/golden teeth tests build variant modules from the text
# format; `wat` is the parser wasmtime itself vendors (its optional
# `wat` dep), used here to produce wasm BYTES for `run_answer`.
wat = "1"
