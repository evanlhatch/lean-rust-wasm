name = "Dbsp"
defaultTargets = ["Dbsp", "DbspTests"]

# LSpec's `@[test_driver]`-registered runner for `lake test` (D14).
testDriver = "DbspTests"

# The delta-theory package: streams, operators, D/I, linearity, fixpoints.
# mathlib accepted per notes/lean/lean-v3.md D1 (model-side packages).
# No flatland vocabulary in this package — it is general and public-grade.

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.0"

# Test harness per notes/lean/lean-v3.md D14. No v4.33.0 tag exists upstream;
# e780f4188c9649aef988270f4d126651460ca9c4 is main@"chore: Update Lean to
# v4.33.0 (#84)", lean-toolchain = leanprover/lean4:v4.33.0 (verified).
[[require]]
name = "LSpec"
git = "https://github.com/argumentcomputer/LSpec"
rev = "e780f4188c9649aef988270f4d126651460ca9c4"

# The shared test harness (core + LSpec only; see notes/lean/lean-v3.md D14).
[[require]]
name = "TestKit"
path = "../TestKit"

[[lean_lib]]
name = "Dbsp"
roots = ["Dbsp"]
# doctrine lints on for library code; weak so Tests can override
weakLeanArgs = ["-Dweak.linter.flexible=true"]

[[lean_exe]]
name = "DbspTests"
root = "Tests.Main"

# D12: gonzalgo — the axiom-provenance/dependency dump behind `just lean-trust`.
[[require]]
name = "gonzalgo"
git = "https://github.com/vince-gonzalez/gonzalgo"
rev = "7e67f77292685c0e295027b530349e3c664a2758"
