name = "LeanSubstrait"
defaultTargets = ["LeanSubstrait", "LeanSubstraitTests"]

# LSpec's @[test_driver]-registered runner for `lake test`.
testDriver = "LeanSubstraitTests"

# The typed query language + Vortex dtype model + text emitter.
# The binary protobuf codec (ProtoGen/) and its Lean-zh/protobuf dep are
# EXCLUDED — add them back when binary Substrait interchange is needed
# (git = https://github.com/Lean-zh/protobuf.git, rev = 8c707f2cb4ab8eae280127651162d28e58164c1e).
# moreLeanArgs for ProtoGen: -DmaxHeartbeats=2000000 -DmaxRecDepth=20000

[[lean_lib]]
name = "LeanSubstrait"
roots = ["LeanSubstrait"]

[[lean_exe]]
name = "LeanSubstraitTests"
root = "Tests.Main"

[[require]]
name = "LSpec"
git = "https://github.com/argumentcomputer/LSpec"
rev = "e780f4188c9649aef988270f4d126651460ca9c4"

[[require]]
name = "TestKit"
path = "../TestKit"
