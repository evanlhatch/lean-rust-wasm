name = "WasmBackend"
defaultTargets = ["WasmBackend"]

# Sibling consistency: the #guard test exe is the test driver.
testDriver = "WasmBackendTests"

# The compiler line: LCNF → WASM. A separate executable (the `leanir`
# pattern): imports the target module's oleans, RE-RUNS the LCNF pipeline
# (the impure-phase LCNF is not persisted), and emits WAT for each final
# `Decl`. DemoFn is the compiled-functions module (the demo stage).

# 2.1: CodegenCore only (GenMain needs `Emit.kebab` + `Emit.header`).
# SchemaLang pulled mathlib/aesop/batteries into the transitive closure
# for nothing — the backend's modules import Lean core + CodegenCore.
[[require]]
name = "CodegenCore"
path = "../codegen-core"

# GenMain's LCNF re-run compiles the GUEST IMPLS (lean/std) — the std
# package requires codegen-core + schema-lang only (no back-edge; the
# backend's stdOp? maps the intrinsics BY NAME).
[[require]]
name = "GuestlangStd"
path = "../std"

[[lean_lib]]
name = "WasmBackend"
roots = ["WasmBackend"]

[[lean_lib]]
name = "DemoFn"
roots = ["DemoFn"]

[[lean_exe]]
name = "wasm-gen"
root = "GenMain"
# importModules + LCNF re-run: replay DemoFn's initializers + compile in-process.
supportInterpreter = true

[[lean_exe]]
name = "WasmBackendTests"
root = "Tests.Main"
