name = "WasmBackend"
defaultTargets = ["WasmBackend"]

# Sibling consistency: the #guard test exe is the test driver.
testDriver = "WasmBackendTests"

# The compiler line: LCNF → WASM. A separate executable (the `leanir`
# pattern): imports the target module's oleans, RE-RUNS the LCNF pipeline
# (the impure-phase LCNF is not persisted), and emits WAT for each final
# `Decl`. DemoFn is the compiled-functions module (the demo stage).

# 2.1: CodegenCore only (GenMain needs `Emit.kebab` + `Emit.header`).
# SchemaLang pulled mathlib/aesop/batteries into the transitive closure
# for nothing — the backend's modules import Lean core + CodegenCore.
[[require]]
name = "CodegenCore"
path = "../codegen-core"

# GenMain's LCNF re-run compiles the GUEST IMPLS (lean/std) — the std
# package requires codegen-core + schema-lang only (no back-edge; the
# backend's stdOp? maps the intrinsics BY NAME).
[[require]]
name = "GuestlangStd"
path = "../std"

[[require]]
name = "LintKit"
path = "../LintKit"

# TestKit: core + LSpec only, so the backend's core-only closure is
# untouched — the Tests exe ships the oracle's corruption-negative
# DiffSpec (doctrine §4).
[[require]]
name = "TestKit"
path = "../TestKit"

[[lean_lib]]
name = "WasmBackend"
roots = ["WasmBackend"]
# Correct.lean (the translation-correctness lane) is not imported by the
# root module (the emitter) — glob it explicitly so `lake build` gates it.
globs = ["WasmBackend", "WasmBackend.Correct", "WasmBackend.Audit", "WasmBackend.Sem"]

# The audit lane's test module (hand-program positive/negative controls
# for WasmBackend.Audit) — a lib root so `Tests.Main` can import it.
[[lean_lib]]
name = "WasmBackendTestsLib"
roots = ["Tests"]

[[lean_lib]]
name = "DemoFn"
roots = ["DemoFn"]

# The differential oracle's row universe (extracted from
# target/oracle.lean so Tests can import it — module header owns the
# byte-compat invariant).
[[lean_lib]]
name = "Oracle"
roots = ["Oracle"]

[[lean_exe]]
name = "wasm-gen"
root = "GenMain"
# importModules + LCNF re-run: replay DemoFn's initializers + compile in-process.
supportInterpreter = true

[[lean_exe]]
name = "oracle"
root = "OracleMain"
# The differential oracle's driver: rows + expecteds from the Oracle
# library (the single source — the generated-script era is over).

[[lean_exe]]
name = "WasmBackendTests"
root = "Tests.Main"
