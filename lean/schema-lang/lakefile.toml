name = "SchemaLang"
defaultTargets = ["SchemaLang", "SchemaLangTests"]

# LSpec's @[test_driver]-registered runner for `lake test`.
testDriver = "SchemaLangTests"

# The schema language: target-neutral type universe, item model,
# resolution well-formedness, compat diff, emitters. Consumes
# codegen-core (registries); knows nothing about WIT/Rust/OpenAPI.

[[require]]
name = "Machines"
path = "../Machines"

[[require]]
name = "CodegenCore"
path = "../codegen-core"

[[require]]
name = "TestKit"
path = "../TestKit"

[[require]]
name = "Substrait"
path = "../substrait"

[[lean_lib]]
name = "SchemaLang"
roots = ["SchemaLang"]

# The demo authoring surface: native Lean structures + @[schema].
# Separate root so `lake exe schema-gen` can importModules #[`Demo].
[[lean_lib]]
name = "Demo"
roots = ["Demo"]

[[lean_exe]]
name = "SchemaLangTests"
root = "Tests.Main"
# Golden checks replay Demo's `@[schema]` registrations via
# importModules + enableInitializersExecution (unsafe init path).
supportInterpreter = true

[[lean_exe]]
name = "schema-gen"
root = "GenMain"
# `enableInitializersExecution` (extension replay for importModules) runs
# imported initializers through the interpreter — needs the core native
# impls (IO.getRandomBytes) linked in.
supportInterpreter = true
