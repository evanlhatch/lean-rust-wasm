name = "SchemaLang"
defaultTargets = ["SchemaLang", "SchemaLangTests"]

# LSpec's @[test_driver]-registered runner for `lake test`.
testDriver = "SchemaLangTests"

# The schema language: target-neutral type universe, item model,
# resolution well-formedness, proof-carrying compat diff. Consumes
# codegen-core (registries); knows nothing about WIT/Rust/OpenAPI.

[[require]]
name = "CodegenCore"
path = "../codegen-core"

[[require]]
name = "TestKit"
path = "../TestKit"

[[lean_lib]]
name = "SchemaLang"
roots = ["SchemaLang"]

[[lean_exe]]
name = "SchemaLangTests"
root = "Tests.Main"

[[lean_exe]]
name = "schema-gen"
root = "GenMain"
