name = "SchemaLang"
defaultTargets = ["SchemaLang", "SchemaLangTests"]

# LSpec's @[test_driver]-registered runner for `lake test`.
testDriver = "SchemaLangTests"

# The schema language: target-neutral type universe, item model,
# resolution well-formedness, compat diff, emitters. Consumes
# codegen-core (registries); knows nothing about WIT/Rust/OpenAPI.

[[require]]
name = "Machines"
path = "../Machines"

# Dbsp as a DIRECT dep (W4.3): TickCascade instantiates
# `Dbsp.Effects.DeltaSystem` at the row/update cascade — the law class
# must not ride Machines' manifest (the fragile inherited form).
[[require]]
name = "Dbsp"
path = "../dbsp"

[[require]]
name = "CodegenCore"
path = "../codegen-core"

[[require]]
name = "TestKit"
path = "../TestKit"

[[require]]
name = "Substrait"
path = "../substrait"

# Plausible as a DIRECT dep (the generators lane): SchemaLang.Gen imports
# it library-side, so the dep must not ride mathlib's manifest (the
# fragile inherited form). Same pinned rev the tree already vendors.
[[require]]
name = "Plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "b7eb3304aeae834b12dda98993a37f6a41f6f0bb"

[[require]]
name = "LintKit"
path = "../LintKit"

[[lean_lib]]
name = "SchemaLang"
roots = ["SchemaLang", "GenMain", "CheckMain", "BreakingMain"]

# The demo authoring surface: native Lean structures + @[schema].
# Separate root so `lake exe schema gen` can importModules #[`Demo].
[[lean_lib]]
name = "Demo"
roots = ["Demo"]

[[lean_exe]]
name = "SchemaLangTests"
root = "Tests.Main"
# Golden checks replay Demo's `@[schema]` registrations via
# importModules + enableInitializersExecution (unsafe init path).
supportInterpreter = true

# Unified driver: schema gen | check | breaking (subcommands).
[[lean_exe]]
name = "schema"
root = "SchemaMain"
# `enableInitializersExecution` (extension replay for importModules) runs
# imported initializers through the interpreter — needs the core native
# impls (IO.getRandomBytes) linked in.
supportInterpreter = true
