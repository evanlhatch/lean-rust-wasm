name = "QLang"
defaultTargets = ["QLang", "QLangTests"]

# LSpec's @[test_driver]-registered runner for `lake test`.
testDriver = "QLangTests"

# The query-language package: the two-surface authoring layer over Substrait
# (notes/lean/research-lean-substrait-pkg.md package-boundary rule — this
# package owns the authoring surface and communicates with the substrate by
# the Substrait.Typed Rel/Plan types only; it knows no wire details).
# Core-only: no mathlib, matching the substrait package's dependency policy.

[[require]]
name = "CodegenCore"
path = "../codegen-core"

[[require]]
name = "Substrait"
path = "../substrait"

# The shared test harness (core + LSpec only; notes/lean/lean-v3.md D14).
[[require]]
name = "TestKit"
path = "../TestKit"

[[lean_lib]]
name = "QLang"
roots = ["QLang"]

[[lean_exe]]
name = "QLangTests"
root = "Tests.Main"
