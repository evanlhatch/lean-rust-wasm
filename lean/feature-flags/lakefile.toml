name = "FeatureFlags"
defaultTargets = ["FeatureFlags", "FeatureFlagsFn", "FeatureFlagsTests"]

# LSpec's @[test_driver]-registered runner for `lake test`.
testDriver = "FeatureFlagsTests"

# The schema layer: the boundary universe + the @[schema]/@[schema_fn]
# reflection this package's spec module registers into.
[[require]]
name = "SchemaLang"
path = "../schema-lang"

# The guest gate (`@[guest]`/`@[guest_std]` — the elab-time runtime ban).
[[require]]
name = "CodegenCore"
path = "../codegen-core"

# The test/gate harness (core + LSpec only).
[[require]]
name = "TestKit"
path = "../TestKit"

# The lifecycle machine (the machine! preset row).
[[require]]
name = "Machines"
path = "../Machines"

# The spec module: the SSOT the gen driver imports (importModules +
# enableInitializersExecution replays the @[schema] registrations).
[[lean_lib]]
name = "FeatureFlags"
# Templates: the W8.10 template/slot machinery (feature-flags-local —
# the runbook order does not move schema machinery out of SchemaLang).
roots = ["FeatureFlags", "Machine", "Templates"]

# The impl module: the guest bodies of the spec's functions.
[[lean_lib]]
name = "FeatureFlagsFn"
roots = ["FeatureFlagsFn"]

# The stress lane's module (a lib root so `Tests.Main` can import it —
# the wasm-backend WasmBackendTestsLib pattern).
[[lean_lib]]
name = "FeatureFlagsTestsLib"
roots = ["Tests.Stress"]

[[lean_exe]]
name = "FeatureFlagsTests"
root = "Tests.Main"
# Registry replay needs the interpreter (the initializers' unsafe init
# path) — same as schema-lang's test/gen exes.
supportInterpreter = true
