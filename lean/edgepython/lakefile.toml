name = "EdgePython"
defaultTargets = ["EdgePython", "EdgeWat"]

# LSpec-free: the #guard blocks gate at BUILD time (the Sem.lean
# convention); this exe is the driver `lake test` runs.
testDriver = "EdgePythonTests"

[[lean_lib]]
name = "EdgePython"
roots = ["EdgePython", "EdgePython.Parity"]

# The FROZEN target-IR: WasmBackend.Wat is imported, never edited (the
# wasm-backend lane's contract). Mounted by srcDir instead of a
# [[require]] — a require would drag wasm-backend's full dep closure
# (mathlib et al) into this package for one Init-only module; the
# srcDir lib reads the module in place and writes nothing back.
[[lean_lib]]
name = "EdgeWat"
srcDir = "../wasm-backend"
roots = ["WasmBackend.Wat"]

[[lean_lib]]
name = "EdgeGen"
roots = ["GenMain"]

[[lean_exe]]
name = "EdgePythonTests"
root = "Tests.Main"

# The artifact writer: target/py.wat (the justfile drives wasm-tools).
[[lean_exe]]
name = "py-gen"
root = "GenMain"
