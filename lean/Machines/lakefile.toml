name = "Machines"
defaultTargets = ["Machines", "MachinesTests"]

# LSpec's @[test_driver]-registered runner for `lake test`.
testDriver = "MachinesTests"

# Guarded state machines: executable + proof relation (the two projections),
# convergence, refinement, composition, traces, rewind. mathlib per
# notes/lean/lean-v3.md D1. No flatland vocabulary.

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.0"

# The correspondence kit (Iso/PartialIso/Denotes/ReprOp/CheckedProp)
# lives in CodegenCore.Kit (core-only); Foundations
# re-exports it (W1.1).
[[require]]
name = "CodegenCore"
path = "../codegen-core"

# The shared test harness (core + LSpec only; see notes/lean/lean-v3.md D14).
[[require]]
name = "TestKit"
path = "../TestKit"

# The change-structure classes (Change/Difference/ChangeInversion/Noc +
# the groupSelf instances) live in Dbsp.ChangeSpec — LinearMachine used
# to re-declare them (no dbsp dependency); the direction now allows the
# import, and copies delete.
[[require]]
name = "Dbsp"
path = "../dbsp"

[[lean_lib]]
name = "Machines"
roots = ["Machines"]
# doctrine lints on for library code; weak so Tests can override
weakLeanArgs = ["-Dweak.linter.flexible=true"]

[[lean_exe]]
name = "MachinesTests"
root = "Tests.Main"

# D12: gonzalgo — the axiom-provenance/dependency dump behind `just lean-trust`.
[[require]]
name = "gonzalgo"
git = "../../vendor/gonzalgo.bundle"
rev = "7e67f77292685c0e295027b530349e3c664a2758"

