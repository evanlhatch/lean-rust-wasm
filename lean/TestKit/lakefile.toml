name = "TestKit"
defaultTargets = ["TestKit", "TestKitTests"]
testDriver = "TestKitTests"

# The shared test harness (notes/lean/lean-v3.md D14 operationalized):
# CheckResult→Testable adapters, golden-file driver, PropSpec with the
# mandatory negative control. Core + LSpec only — no mathlib — so EVERY
# package's test lane (including the core-only wire/emitter packages per D1)
# can require it without polluting their internals.

[[require]]
name = "LSpec"
git = "https://github.com/argumentcomputer/LSpec"
rev = "e780f4188c9649aef988270f4d126651460ca9c4"

[[lean_lib]]
name = "TestKit"
roots = ["TestKit"]

[[lean_exe]]
name = "TestKitTests"
root = "Tests.Main"
