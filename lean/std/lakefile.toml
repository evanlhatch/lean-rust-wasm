name = "GuestlangStd"

defaultTargets = ["GuestlangStd", "GuestlangStdTests"]

# LSpec's @[test_driver]-registered runner for `lake test`.
testDriver = "GuestlangStdTests"

# The COMPILED stdlib + the guest implementations of the schema's
# functions. Depends on schema-lang (the TYPES — Demo's records) and
# codegen-core; the BACKEND (wasm-backend) depends on NEITHER the std
# ops' bodies nor this package: the intrinsics map BY NAME (data) —
# the layering stays acyclic (the backend re-runs this package's LCNF
# at compile time, but imports it as oleans, not as a require).

[[require]]
name = "SchemaLang"
path = "../schema-lang"



[[require]]
name = "CodegenCore"
path = "../codegen-core"

# LintKit: core-only, meta-only — the `@[nolint]` on the `GuestImpl`
# decls below (the WIT-contract guest-impl namespace is deliberately
# unprefixed). Not imported by downstream consumers of GuestlangStd.
[[require]]
name = "LintKit"
path = "../LintKit"

[[require]]
name = "TestKit"
path = "../TestKit"

[[lean_lib]]
name = "GuestlangStd"
roots = ["GuestlangStd"]

[[lean_exe]]
name = "GuestlangStdTests"
root = "Tests.Main"
