# The mandate scaffold (first commit, per notes/v3/14-build-map.md §4).
# No library targets yet — they arrive with their first content (the
# doctrine's leftover rule: nothing lands without a consumer). Libraries
# will live as members of this package, cone-ordered: C0 machinery →
# C1 domain cores → C2 theory → C3 apps + lanes (notes/v3/01-core.md,
# notes/v3/14-build-map.md §2). A cone-low module importing cone-high is
# a gate failure (notes/v3/06-lean-rules.md).

name = "Mandate"
version = "0.1.0"

# The default build covers every library (the lakefile-fixer wave's
# catch: a bare lake build with no defaultTargets builds NOTHING — the
# green-by-vacuity trap). The test EXES stay out of the default build
# (just test runs them).
defaultTargets = ["Kit", "TextKit", "TestingKit", "LintKit", "Gates", "SchemaCore", "WasmCore", "Wit", "Machines", "ZSet", "Inspector", "Datalog", "Analysis", "Cost", "Scaffold", "Query", "Vortex", "Guest", "Effects", "ScaffoldDemo", "ScaffoldLedger"]

# ── TestingKit (the shared test harness; notes/v3/15-patterns.md #5 + #14) ──
# Core-only: no LSpec, no Plausible, no mathlib.

[[lean_lib]]
name = "TestingKit"
srcDir = "testingkit"
roots = ["TestingKit"]
globs = ["TestingKit", "TestingKit.+"]

[[lean_exe]]
name = "TestingKitTests"
srcDir = "testingkit"
root = "TestingKitTests.Main"

# ── TextKit (the core-only text/parser foundation; notes/v3/05-codegen.md §1,
#    notes/v3/15-patterns.md #12) ──
# Total parsers over the List Char core + the inversion kit + the structured
# ParseError + the positioned combinator surface. No grammar layer here
# (Phase 4 sits on top of this carrier).

[[lean_lib]]
name = "TextKit"
srcDir = "textkit"
roots = ["TextKit"]
globs = ["TextKit", "TextKit.+", "TextKitTests.+"]

[[lean_exe]]
name = "TextKitTests"
srcDir = "textkit"
root = "TextKitTests.Main"

# ── Cli — the gates exe's argv parser (lean4-cli) ──────────────────────
# v4.33.0 = the exact rev the legacy tree pinned (its manifest carried it
# transitively through mathlib's closure).

[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli"
rev = "6130a47896ce867c6a4a55373441e59e565bad0f"

# ── lean4lean (the kernel-check gate's independent double-check) ───────
# batteries at the TREE-compatible rev (v4.33.0 = 4488d40, what the legacy
# tree's mathlib closure already vendored). This ROOT require deliberately
# overrides lean4lean's own batteries pin (v4.33.0-rc2): lean4lean builds
# green under the v4.33.0 RELEASE toolchain with batteries v4.33.0
# (probe-verified in the legacy tree; Gates/KernelCheck.lean's header).
# The tree's own libraries import NOTHING from batteries (the cone rule);
# the require exists only so `lake build lean4lean:exe` resolves.

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "4488d40d070b9700d4d5a6aa342f0d40c31b2a2d"

# lean4lean — the pure-Lean kernel, the independent double-check behind
# `gates kernel-check`. Master @ 8223d22 targets leanprover/lean4:v4.33.0-rc2;
# pinned here (the legacy tree's verified rev) — it builds under the
# v4.33.0 release toolchain with the batteries override above. Only its
# `lean4lean` exe target is built (on demand by kernel-check) — the tree's
# own code imports nothing from it, so iteration cost is unaffected.

[[require]]
name = "lean4lean"
git = "https://github.com/digama0/lean4lean"
rev = "8223d223ed98661882e95d9d6a7126df7097cd76"

# ── LintKit (the minimal env-linter engine; notes/v3/06-lean-rules.md,
#    notes/v3/09-gates-ops.md §3) ──
# Core-only so any package may import it. The linters + skip discipline are
# mined from legacy/lean/LintKit (the proven pattern, ported fresh).

[[lean_lib]]
name = "LintKit"
srcDir = "lintkit"
roots = ["LintKit"]
globs = ["LintKit", "LintKit.+"]

[[lean_exe]]
name = "lintkit"
srcDir = "lintkit"
root = "LintMain"
# importModules + loadExts runs imported initializers through the
# interpreter — the legacy LintMain pattern.
supportInterpreter = true

# ── LintKit tests (the cone linter's teeth; notes/v3/15-patterns.md #5) ──
# The test exe pulls SchemaCore ON PURPOSE: LintKitTests.Violator plants
# the cone violation (a C0-rooted test module importing the C1
# SchemaCore root — 06 §8's gate failure, fired); LintKitTests.Main is
# the compliant module (the mandatory negative control). The
# Mathlib/Batteries ban's positive control lives at the data level
# (coneOffences) — no such import can exist in a core-only closure.

[[lean_lib]]
name = "LintKitTestsLib"
srcDir = "lintkit"
roots = ["LintKitTests.Main", "LintKitTests.Violator", "LintKitFixtures.Violations", "LintKitFixtures.Clean", "LintKitFixturesUntabled.Violator"]
# No bare "LintKitTests" glob: a Glob.one emits the module unconditionally
# (Lake's Glob.forEachModuleIn checks no file), and lintkit/LintKitTests.lean
# does not exist — the phantom module's unreadable source fails the imports
# job at collection time ("some modules have bad imports").
globs = ["LintKitTests.+", "LintKitFixtures.+", "LintKitFixturesUntabled.+"]

[[lean_exe]]
name = "LintKitTests"
srcDir = "lintkit"
root = "LintKitTests.Main"
# importModules + loadExts (same driver pattern as `lintkit`).
supportInterpreter = true

# ── Gates (the thin gates skeleton; notes/v3/09-gates-ops.md §3) ──
# The gate registry + the report-gate combinator + the first two gates
# (axioms, docs-check). Consumes LintKit's allowlist — never re-encodes it.

[[lean_lib]]
name = "Gates"
srcDir = "gates"
roots = ["Gates"]

[[lean_exe]]
name = "gates"
srcDir = "gates"
root = "GatesMain"
# enableInitializersExecution (the import-preamble) is unsafe — the
# interpreter must be on.
supportInterpreter = true

# ── Kit (the graded correspondence library + its substrate) ──
# Core-only (no mathlib/Batteries — the cone rule). Tests: the exe
# carries the positive pins + the mandatory negative controls.

[[lean_lib]]
name = "Kit"
srcDir = "kit"
roots = ["Kit"]
globs = ["Kit", "Kit.+"]

[[lean_lib]]
name = "KitTestsLib"
srcDir = "kit"
roots = ["KitTests.Main", "KitTests.Axioms"]

[[lean_exe]]
name = "KitTests"
srcDir = "kit"
root = "KitTests.Main"

