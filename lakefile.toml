# `SchemaCore.Slice` is the registered fixture module — part of the lib
# (the drivers replay it), not of the umbrella's imports. Tests: the
# exe carries the positive pins + the mandatory negative controls.

[[lean_lib]]
name = "SchemaCore"
srcDir = "schemacore"
roots = ["SchemaCore"]
globs = ["SchemaCore", "SchemaCore.+", "SchemaTests.+"]

[[lean_lib]]
name = "SchemaTestsLib"
srcDir = "schemacore"
roots = ["SchemaTests.Main", "SchemaTests.Axioms", "SchemaTests.EntityMachine"]

[[lean_exe]]
name = "SchemaTests"
srcDir = "schemacore"
root = "SchemaTests.Main"

# The schema regen driver (the byte-tie's writer side). Unsafe main:
# the runtime replay executes imported initializers.
[[lean_exe]]
name = "schema"
srcDir = "schemacore"
root = "SchemaMain"
supportInterpreter = true

