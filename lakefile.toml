# The macht scaffold (first commit, per notes/v3/14-build-map.md §4).
# No library targets yet — they arrive with their first content (the
# doctrine's leftover rule: nothing lands without a consumer). Libraries
# will live as members of this package, cone-ordered: C0 machinery →
# C1 domain cores → C2 theory → C3 apps + lanes (notes/v3/01-core.md,
# notes/v3/14-build-map.md §2). A cone-low module importing cone-high is
# a gate failure (notes/v3/06-lean-rules.md).

name = "Macht"
version = "0.1.0"

# ── TestKit (the shared test harness; notes/v3/15-patterns.md #5 + #14) ──
# Core-only: no LSpec, no Plausible, no mathlib.

[[lean_lib]]
name = "TestKit"
srcDir = "testkit"
roots = ["TestKit"]
globs = ["TestKit", "TestKit.+"]

[[lean_exe]]
name = "TestKitTests"
srcDir = "testkit"
root = "TestKitTests.Main"

# ── TextKit (the core-only text/parser foundation; notes/v3/05-codegen.md §1,
#    notes/v3/15-patterns.md #12) ──
# Total parsers over the List Char core + the inversion kit + the structured
# ParseError + the positioned combinator surface. No grammar layer here
# (Phase 4 sits on top of this carrier).

[[lean_lib]]
name = "TextKit"
srcDir = "textkit"
roots = ["TextKit"]
globs = ["TextKit", "TextKit.+", "TextKitTests.+"]

[[lean_exe]]
name = "TextKitTests"
srcDir = "textkit"
root = "TextKitTests.Main"

# ── Cli — the gates exe's argv parser (lean4-cli) ──────────────────────
# v4.33.0 = the exact rev the legacy tree pinned (its manifest carried it
# transitively through mathlib's closure).

[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli"
rev = "6130a47896ce867c6a4a55373441e59e565bad0f"

# ── LintKit (the minimal env-linter engine; notes/v3/06-lean-rules.md,
#    notes/v3/09-gates-ops.md §3) ──
# Core-only so any package may import it. The linters + skip discipline are
# mined from legacy/lean/LintKit (the proven pattern, ported fresh).

[[lean_lib]]
name = "LintKit"
srcDir = "lintkit"
roots = ["LintKit"]
globs = ["LintKit", "LintKit.+"]

[[lean_exe]]
name = "lintkit"
srcDir = "lintkit"
root = "LintMain"
# importModules + loadExts runs imported initializers through the
# interpreter — the legacy LintMain pattern.
supportInterpreter = true

# ── LintKit tests (the cone linter's teeth; notes/v3/15-patterns.md #5) ──
# The test exe pulls SchemaCore ON PURPOSE: LintKitTests.Violator plants
# the cone violation (a C0-rooted test module importing the C1
# SchemaCore root — 06 §8's gate failure, fired); LintKitTests.Main is
# the compliant module (the mandatory negative control). The
# Mathlib/Batteries ban's positive control lives at the data level
# (coneOffences) — no such import can exist in a core-only closure.

[[lean_lib]]
name = "LintKitTestsLib"
srcDir = "lintkit"
roots = ["LintKitTests.Main", "LintKitTests.Violator"]
globs = ["LintKitTests", "LintKitTests.+"]

[[lean_exe]]
name = "LintKitTests"
srcDir = "lintkit"
root = "LintKitTests.Main"
# importModules + loadExts (same driver pattern as `lintkit`).
supportInterpreter = true

# ── Gates (the thin gates skeleton; notes/v3/09-gates-ops.md §3) ──
# The gate registry + the report-gate combinator + the first two gates
# (axioms, docs-check). Consumes LintKit's allowlist — never re-encodes it.

[[lean_lib]]
name = "Gates"
srcDir = "gates"
roots = ["Gates"]

[[lean_exe]]
name = "gates"
srcDir = "gates"
root = "GatesMain"
# enableInitializersExecution (the import-preamble) is unsafe — the
# interpreter must be on.
supportInterpreter = true

# ── Kit (the graded correspondence library + its substrate) ──
# Core-only (no mathlib/Batteries — the cone rule). Tests: the exe
# carries the positive pins + the mandatory negative controls.

[[lean_lib]]
name = "Kit"
srcDir = "kit"
roots = ["Kit"]

[[lean_lib]]
name = "KitTestsLib"
srcDir = "kit"
roots = ["KitTests.Main", "KitTests.Axioms"]

[[lean_exe]]
name = "KitTests"
srcDir = "kit"
root = "KitTests.Main"

# ── SchemaCore (the C1 proof-of-life slice) ──────────────────────────
# The closed Ty universe + the item model + the @[schema] registration
# + the first emitter. Core-only (imports Kit — the cone rule).
# `SchemaCore.Slice` is the registered fixture module — part of the lib
# (the drivers replay it), not of the umbrella's imports. Tests: the
# exe carries the positive pins + the mandatory negative controls.

[[lean_lib]]
name = "SchemaCore"
srcDir = "schemacore"
roots = ["SchemaCore"]
globs = ["SchemaCore", "SchemaCore.+", "SchemaTests.+"]

[[lean_lib]]
name = "SchemaTestsLib"
srcDir = "schemacore"
roots = ["SchemaTests.Main", "SchemaTests.Axioms"]

[[lean_exe]]
name = "SchemaTests"
srcDir = "schemacore"
root = "SchemaTests.Main"

# The schema regen driver (the byte-tie's writer side). Unsafe main:
# the runtime replay executes imported initializers.
[[lean_exe]]
name = "schema"
srcDir = "schemacore"
root = "SchemaMain"
supportInterpreter = true

# ── WasmCore (the wasm domain core — Phase 6's seed) ──────────────────
# A domain model of an external ISA riding the kit's machinery (the
# Codec wire grade + the CheckedProp statement grade). Core-only —
# guest-relevant later, so the cone matters (imports: Kit only).
# Tests: the exe carries the positive pins + the mandatory negative
# controls; Axioms.lean is part of the tests lib (the axiom self-check).

[[lean_lib]]
name = "WasmCore"
srcDir = "wasmcore"
roots = ["WasmCore"]
globs = ["WasmCore", "WasmCore.+", "WasmCoreTests.+"]

[[lean_lib]]
name = "WasmCoreTestsLib"
srcDir = "wasmcore"
roots = ["WasmCoreTests.Main", "WasmCoreTests.Axioms"]

[[lean_exe]]
name = "WasmCoreTests"
srcDir = "wasmcore"
root = "WasmCoreTests.Main"

# ── Kit.Lane — the lane substrate's demo lane (the end-to-end fixture) ──
# The registration module (the register_lane mount) + the consumption
# module (the entries + the build-time pins + the #guard_msgs curated
# failures). A module's own initializers run only at import, so the
# registration and the consumption are different modules. Consumed by
# KitTests.Main (import; the value-level pins ride the exe).

[[lean_lib]]
name = "KitLaneDemo"
srcDir = "kit"
roots = ["KitTests.LaneReg", "KitTests.LaneDemo"]
