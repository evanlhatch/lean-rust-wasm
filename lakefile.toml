# WAT text lane + the wasm bytes + the .hdr sidecar through the emit
# spine). Safe main — no env replay (WasmCore is core-only).
[[lean_exe]]
name = "wasmgen"
srcDir = "wasmcore"
root = "WasmGenMain"

