# A domain model of an external ISA riding the kit's machinery (the
# Codec wire grade + the CheckedProp statement grade). Core-only —
# guest-relevant later, so the cone matters (imports: Kit only).
# Tests: the exe carries the positive pins + the mandatory negative
# controls; Axioms.lean is part of the tests lib (the axiom self-check).

[[lean_lib]]
name = "WasmCore"
srcDir = "wasmcore"
roots = ["WasmCore"]
globs = ["WasmCore", "WasmCore.+", "WasmCoreTests.+"]

[[lean_lib]]
