# devenv-based CI: toolchain is nix-provisioned by the devenv shell
# (rust-overlay) — no actions/setup-rust-toolchain. target/ + registry
# cache via Swatinem/rust-cache; the devenv cachix cache covers the
# nix side.

name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: cachix/install-nix-action@v31
            - uses: cachix/cachix-action@v16
              with:
                  name: devenv
            - name: Install devenv
              run: nix profile add nixpkgs#devenv
            - uses: Swatinem/rust-cache@v2
            - name: tests (nextest + doctests)
              run: devenv shell -- bash -c 'just test'
            - name: clippy
              run: devenv shell -- bash -c 'just clippy'
            - name: fmt
              run: devenv shell -- bash -c 'just fmt'
            - name: typos
              run: devenv shell -- bash -c 'just typos'
